name: Coffee App CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - name: Исходный кодты жүктеу
      uses: actions/checkout@v3

    - name: Node.js ортасын баптау
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'

    - name: Тәуелділіктер мен пакеттерді орнату
      run: npm install --legacy-peer-deps

    - name: Автоматты модульдік тесттерді іске қосу (Unit Tests)
      run: npm test
